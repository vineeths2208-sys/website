<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title></title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      cursor: default;
    }

    body.hide-cursor, body.hide-cursor canvas {
      cursor: none !important;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    (function() {
      const TOTAL_FRAMES = 297;
      const TARGET_FPS = 30;
      const LERP_SPEED = 14; // Smooth exponential damping factor

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      const images = new Array(TOTAL_FRAMES + 1);
      let loadedCount = 0;
      let firstFrameLoaded = false;

      let currentFrame = 1;
      let targetFrame = 1;
      let playDirection = 1;
      let isAutoplay = true;
      let isInteracting = false;
      let interactionTimer = null;
      let lastTime = performance.now();

      // Find working base path
      const candidatePaths = [
        './',
        './ezgif-10e4e40b7483855d-jpg/',
        '../ezgif-10e4e40b7483855d-jpg/'
      ];

      function formatFrameName(index) {
        return 'ezgif-frame-' + String(index).padStart(3, '0') + '.jpg';
      }

      function resolvePathAndInit() {
        let index = 0;
        function testNext() {
          if (index >= candidatePaths.length) {
            initApp('./');
            return;
          }
          const testBase = candidatePaths[index];
          const probe = new Image();
          probe.onload = () => initApp(testBase);
          probe.onerror = () => {
            index++;
            testNext();
          };
          probe.src = testBase + formatFrameName(1);
        }
        testNext();
      }

      function initApp(basePath) {
        // Preload frame 1 first for immediate display
        const f1 = new Image();
        f1.onload = () => {
          images[1] = f1;
          firstFrameLoaded = true;
          loadedCount++;
          requestAnimationFrame(render);
        };
        f1.src = basePath + formatFrameName(1);

        // Preload rest in parallel
        for (let i = 2; i <= TOTAL_FRAMES; i++) {
          const img = new Image();
          const frameIndex = i;
          img.onload = () => {
            images[frameIndex] = img;
            loadedCount++;
          };
          img.src = basePath + formatFrameName(frameIndex);
        }

        setupInteractions();
        requestAnimationFrame(tick);
      }

      function setupInteractions() {
        // Auto-hide cursor on inactivity
        let cursorTimer = null;
        function resetCursor() {
          document.body.classList.remove('hide-cursor');
          clearTimeout(cursorTimer);
          cursorTimer = setTimeout(() => {
            document.body.classList.add('hide-cursor');
          }, 1500);
        }
        window.addEventListener('pointermove', resetCursor, { passive: true });
        window.addEventListener('pointerdown', resetCursor, { passive: true });
        resetCursor();

        function touchInteraction() {
          isInteracting = true;
          clearTimeout(interactionTimer);
          interactionTimer = setTimeout(() => {
            isInteracting = false;
          }, 1600);
        }

        // Wheel / trackpad scroll scrub
        window.addEventListener('wheel', (e) => {
          e.preventDefault();
          touchInteraction();
          const delta = e.deltaY * 0.12;
          targetFrame = Math.max(1, Math.min(TOTAL_FRAMES, targetFrame + delta));
          if (delta > 0) playDirection = 1;
          else if (delta < 0) playDirection = -1;
        }, { passive: false });

        // Pointer / touch drag scrub
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let dragStartFrame = 1;
        let hasMoved = false;

        window.addEventListener('pointerdown', (e) => {
          isDragging = true;
          hasMoved = false;
          startX = e.clientX;
          startY = e.clientY;
          dragStartFrame = targetFrame;
          touchInteraction();
        }, { passive: true });

        window.addEventListener('pointermove', (e) => {
          if (!isDragging) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
            hasMoved = true;
          }
          touchInteraction();
          const frameDelta = (dx / (window.innerWidth * 0.75)) * TOTAL_FRAMES;
          targetFrame = Math.max(1, Math.min(TOTAL_FRAMES, dragStartFrame + frameDelta));
          if (frameDelta > 0) playDirection = 1;
          else if (frameDelta < 0) playDirection = -1;
        }, { passive: true });

        window.addEventListener('pointerup', () => {
          if (!isDragging) return;
          isDragging = false;
          // Click/Tap toggle play/pause
          if (!hasMoved) {
            isAutoplay = !isAutoplay;
          }
          touchInteraction();
        }, { passive: true });

        // Double click fullscreen
        window.addEventListener('dblclick', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
          touchInteraction();
          if (e.code === 'Space') {
            e.preventDefault();
            isAutoplay = !isAutoplay;
          } else if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
            e.preventDefault();
            targetFrame = Math.min(TOTAL_FRAMES, targetFrame + 4);
            playDirection = 1;
          } else if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
            e.preventDefault();
            targetFrame = Math.max(1, targetFrame - 4);
            playDirection = -1;
          }
        });
      }

      function tick(now) {
        const dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;

        // Autoplay progression (ping-pong loop)
        if (isAutoplay && !isInteracting) {
          targetFrame += playDirection * (TARGET_FPS * dt);
          if (targetFrame >= TOTAL_FRAMES) {
            targetFrame = TOTAL_FRAMES;
            playDirection = -1;
          } else if (targetFrame <= 1) {
            targetFrame = 1;
            playDirection = 1;
          }
        }

        // Frame-rate independent exponential lerp
        const factor = 1 - Math.exp(-LERP_SPEED * dt);
        currentFrame += (targetFrame - currentFrame) * factor;

        render();
        requestAnimationFrame(tick);
      }

      function getBestImage(idx) {
        if (images[idx] && images[idx].complete && images[idx].naturalWidth > 0) {
          return images[idx];
        }
        for (let offset = 1; offset <= 30; offset++) {
          const prev = images[idx - offset];
          if (prev && prev.complete && prev.naturalWidth > 0) return prev;
          const next = images[idx + offset];
          if (next && next.complete && next.naturalWidth > 0) return next;
        }
        return images[1] || null;
      }

      function render() {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth;
        const h = window.innerHeight;

        const targetW = Math.floor(w * dpr);
        const targetH = Math.floor(h * dpr);

        if (canvas.width !== targetW || canvas.height !== targetH) {
          canvas.width = targetW;
          canvas.height = targetH;
        }

        ctx.save();
        ctx.scale(dpr, dpr);

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, h);

        const frameIndex = Math.min(TOTAL_FRAMES, Math.max(1, Math.round(currentFrame)));
        const img = getBestImage(frameIndex);

        if (img && img.complete && img.naturalWidth > 0) {
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          const imgW = img.naturalWidth;
          const imgH = img.naturalHeight;
          const imgRatio = imgW / imgH;
          const screenRatio = w / h;

          let drawW, drawH, drawX, drawY;

          if (screenRatio > imgRatio) {
            drawW = w;
            drawH = w / imgRatio;
            drawX = 0;
            drawY = (h - drawH) / 2;
          } else {
            drawH = h;
            drawW = h * imgRatio;
            drawX = (w - drawW) / 2;
            drawY = 0;
          }

          ctx.drawImage(img, drawX, drawY, drawW, drawH);
        }

        ctx.restore();
      }

      resolvePathAndInit();
    })();
  </script>
</body>
</html>
